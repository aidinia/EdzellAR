<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AR Christmas Decorations</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="startScreen">
      <h1>🎄 AR Christmas Decorations</h1>
      <p>
        Automatically uses real WebXR anchored tracking where supported
        (steadiest — won't drift or chase you as you move), and falls back to
        camera + GPS + compass on browsers without WebXR (e.g. iOS Safari).
      </p>
      <button id="startAR">Start AR Experience</button>
      <p id="startStatus"></p>
    </div>

    <div id="arContainer" hidden>
      <canvas id="arCanvas"></canvas>
      <div id="debugOverlay"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="decorations.js"></script>
    <script src="script.js"></script>
  </body>
</html>
